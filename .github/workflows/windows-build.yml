name: Build Windows App
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download FFmpeg for Windows
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri\binaries"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg-win.zip"
          Expand-Archive -Path "ffmpeg-win.zip" -DestinationPath "ffmpeg-extracted" -Force
          Copy-Item "ffmpeg-extracted\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" -Destination "src-tauri\binaries\ffmpeg-x86_64-pc-windows-msvc.exe"
          Remove-Item -Recurse -Force "ffmpeg-win.zip", "ffmpeg-extracted"
        shell: pwsh

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Tauri App
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Upload Windows Installer (.msi)
        uses: actions/upload-artifact@v4
        with:
          name: FartCompressor-Windows-Installer
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload Windows Executable (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: FartCompressor-Windows-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
