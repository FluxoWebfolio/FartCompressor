<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FartCompressor</title>
  <link rel="stylesheet" href="/src/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body class="h-screen flex flex-col items-center justify-center select-none bg-[#f0f5f5]">

  <!-- Global Drop Zone Overlay -->
  <div id="dropOverlay"
    class="absolute inset-0 bg-fart-blue/20 backdrop-blur-sm z-50 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-white p-8 rounded-[28px] shadow-2xl transform scale-110">
      <p class="text-2xl font-bold text-fart-blue uppercase tracking-wider" data-i18n="drop_overlay">Drop your farts here!</p>
    </div>
  </div>

  <!-- Main Container -->
  <div class="w-full h-full flex flex-col relative">

    <!-- 0. Barra de título — VAZIA e toda arrastável (macOS: os semáforos ficam
         nesta faixa; é aqui que se arrasta a janela). No Windows a barra nativa
         mantém-se e esta faixa serve só de topo da app. -->
    <div id="titlebar" data-tauri-drag-region
      class="w-full h-[34px] shrink-0 bg-[#f0f5f5] z-30"></div>

    <!-- 1. Header Image (clicável: mostra as capas/skins anteriores) -->
    <div class="relative w-full h-[35%] max-h-[240px] bg-gray-200 overflow-hidden shrink-0">
      <button id="headerImageBtn" type="button" title="View previous skins" data-i18n-title="header_skins_title"
        class="absolute inset-0 z-10 w-full h-full p-0 border-none bg-transparent cursor-pointer">
        <img id="headerImage" src="/src/assets/header_bg.png" alt="Header" class="w-full h-full object-cover">
      </button>
      <div class="absolute bottom-0 left-0 w-full h-12 bg-gradient-to-t from-[#f0f5f5] to-transparent hidden"></div>

      <!-- Seletor de idioma: EN / PT (círculo branco) sobre a imagem, canto sup. direito -->
      <button id="langToggle" type="button" title="Mudar para Português"
        class="absolute top-2 right-3 z-40 w-8 h-8 flex items-center justify-center text-[11px] font-black leading-none rounded-full bg-white text-black shadow-[0_2px_6px_rgba(0,0,0,0.35)] hover:brightness-95 active:scale-95 transition cursor-pointer select-none">EN</button>

      <!-- Update available banner (hidden by default; shown by update-check.js) -->
      <div id="updateBanner"
        class="hidden absolute top-2 left-1/2 -translate-x-1/2 z-40 flex items-center gap-2 bg-black/80 backdrop-blur-sm text-white text-[11px] font-bold px-3 py-1.5 rounded-full shadow-lg whitespace-nowrap">
        <span id="updateBannerText">New version available</span>
        <button id="updateBannerBtn"
          class="bg-fart-blue hover:brightness-110 text-white text-[10px] font-black uppercase tracking-wider px-2 py-[3px] rounded-full transition cursor-pointer" data-i18n="update_view">View</button>
      </div>
    </div>

    <!-- 2. Main Content Area (Controls the layout flow) -->
    <div class="flex-1 min-h-0 flex flex-col px-8 pt-[10px] pb-[44px] relative" style="overflow: visible;">

      <!-- Top Section: Toggles & Slider (Fixed height) -->
      <div class="shrink-0 space-y-5 mb-5">
        <!-- Toggles Row -->
        <div class="flex justify-center items-start h-auto" style="gap: 50px;">
          <div class="flex flex-col items-center w-[80px]">
            <div id="autoCompressToggle" class="h-[52px] w-[80px] overflow-visible cursor-pointer select-none"
              data-state="off"></div>
            <span
              class="text-[10px] font-bold text-gray-400 uppercase tracking-wider -mt-[6px] whitespace-nowrap" data-i18n="auto_compress">Auto Compress</span>
          </div>

          <!-- Redimensionar Largura Input -->
          <div class="flex flex-col items-center justify-center w-[80px]">
            <div class="h-[52px] flex items-center justify-center">
              <input type="number" id="resizeWidth" placeholder="Auto" data-i18n-placeholder="width_placeholder"
                class="w-[70px] h-[32px] bg-white border-2 border-transparent rounded-[12px] text-center text-[13px] font-bold text-fart-blue shadow-[0_2px_10px_rgba(0,0,0,0.08)] focus:outline-none focus:border-fart-blue transition-all placeholder:text-gray-300 placeholder:font-semibold"
                min="10">
            </div>
            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider -mt-[5px]" data-i18n="width_px">Width px</span>
          </div>

          <!-- Formato de saída (output) -->
          <div class="flex flex-col items-center w-[80px]">
            <div class="h-[52px] flex items-center justify-center">
              <select id="outputFormat"
                class="w-[74px] h-[32px] bg-white border-2 border-transparent rounded-[12px] text-center text-[13px] font-bold text-fart-blue shadow-[0_2px_10px_rgba(0,0,0,0.08)] focus:outline-none focus:border-fart-blue transition-all cursor-pointer appearance-none px-0"
                style="text-align: center; text-align-last: center;">
                <option value="avif" style="text-align:center;">AVIF</option>
                <option value="webp" style="text-align:center;">WEBP</option>
                <option value="jpeg" style="text-align:center;">JPEG</option>
                <option value="png"  style="text-align:center;">PNG</option>
              </select>
            </div>
            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider -mt-[5px]" data-i18n="format">Format</span>
          </div>
        </div>

        <!-- Quality Slider -->
        <div class="w-full relative h-[72px]">
          <div class="absolute left-[23px] top-[45px] -translate-y-1/2 flex flex-col pointer-events-none z-10">
            <span class="text-[11px] font-bold text-black uppercase tracking-wider" data-i18n="compression">Compression</span>
            <span class="text-[9px] font-bold text-gray-400 text-right -mt-[1px]" data-i18n="compression_sub">Ultra-light fart!</span>
          </div>
          <div id="qualitySliderContainer" class="w-full h-full relative"></div>
          <div class="absolute right-[23px] top-[45px] -translate-y-1/2 flex flex-col pointer-events-none z-10">
            <span class="text-[11px] font-bold text-black uppercase tracking-wider" data-i18n="quality">Quality</span>
            <span class="text-[9px] font-bold text-gray-400 text-left -mt-[1px]" data-i18n="quality_sub">Fart with class!</span>
          </div>
        </div>
      </div>

      <!-- Middle Section: File List (Flexible, the only part that scrolls) -->
      <div class="flex-1 min-h-0 flex flex-col mb-5 relative z-10"
        style="box-shadow: 0 2px 25px rgba(0,0,0,0.45); border-radius: 28px;">
        <!-- White File List Window -->
        <div class="flex-1 min-h-0 bg-white border-b border-gray-100 flex flex-col relative rounded-t-[28px]">
          <div
            class="bg-[#e6ebeb] rounded-t-[28px] px-3 py-[6px] grid grid-cols-12 gap-2 text-[11px] font-bold text-gray-400 uppercase tracking-wider border-b border-gray-100 items-center">
            <div class="col-span-5 flex items-center gap-2">
              <div id="clearListBtn"
                class="relative cursor-pointer rounded-md transition-all duration-200 hover:bg-red-500/80 p-[2px]"
                title="Clear list" data-i18n-title="clear_list">
                <img src="/src/assets/IconFolder.svg" alt="Clear list" width="32" height="32" class="select-none">
              </div>
              <span data-i18n="col_file">File</span>
            </div>
            <div class="col-span-1 text-right flex items-center justify-end"></div>
            <div class="col-span-2 text-right flex items-center justify-end" data-i18n="col_before">Before</div>
            <div class="col-span-2 text-right flex items-center justify-end" data-i18n="col_after">After</div>
            <div class="col-span-2 text-right flex items-center justify-end" data-i18n="col_percent">(%)</div>
          </div>

          <!-- Scrollable Area -->
          <div class="overflow-y-auto flex-1 p-0 no-scrollbar relative" id="fileListContainer">
            <div id="emptyState"
              class="absolute inset-0 flex flex-col items-center justify-center text-gray-300 pointer-events-none">
              <svg class="w-12 h-12 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
              </svg>
              <p class="text-xs font-medium" data-i18n="empty_drop">Drop your files here</p>
            </div>
            <div id="filesList" class="">
              <!-- Items will be injected here -->
            </div>
          </div>
        </div>

        <div
          class="shrink-0 bg-black text-white p-3 grid grid-cols-12 gap-2 text-[13px] font-black items-center z-10 tracking-tight rounded-b-[28px]">
          <div class="col-span-5 pl-2" data-i18n="total">TOTAL</div>
          <div class="col-span-1"></div>
          <div class="col-span-2 text-right" id="totalOriginalSize">0 B</div>
          <div class="col-span-2 text-right flex justify-end items-center gap-2">
            <span class="text-[#10b981] font-bold">➜</span>
            <span id="totalCompressedSize" class="text-[13px]">--</span>
          </div>
          <div class="col-span-2 text-right text-[13px]" id="totalSavings">--</div>
        </div>
      </div>

      <!-- Bottom Section: Compress Button & Progress Bar (Fixed at very bottom) -->
      <div class="relative z-50 shrink-0 flex flex-col items-center -mx-8 px-8 bg-[#f0f5f5]">
        <!-- Extra spacing for the button, moved visually up over the shadow -->
        <!-- Abaixo de 588px o COMPRIMIR passa a ocupar a linha toda e os botões
             laterais descem para baixo dele, centrados. -->
        <div class="w-full flex flex-wrap justify-center items-center gap-x-2 gap-y-[7px] mt-[-25px] pb-[10px]">

          <!-- GUARDAR: escolhe a pasta de destino (por defeito: a do ficheiro original) -->
          <button id="saveDirBtn" type="button" title="Choose where to save the compressed files" data-i18n-title="save_title"
            class="h-[44px] shrink-0 px-4 rounded-full bg-white text-black text-[12px] font-black uppercase tracking-wide flex items-center gap-2 cursor-pointer transition-all hover:brightness-105 active:scale-95 max-[588px]:order-2 max-[588px]:mt-[-14px]"
            style="filter: drop-shadow(0 6px 8px rgb(0 0 0 / 0.22));">
            <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 7.5A1.5 1.5 0 014.5 6h4l2 2.5h9A1.5 1.5 0 0121 10v7.5a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 17.5v-10z" />
            </svg>
            <span data-i18n="save">Save</span>
          </button>

          <button id="compressBtn"
            class="group relative shrink-0 cursor-pointer border-none bg-transparent p-0 transition-transform active:scale-95 focus:outline-none max-[588px]:order-1 max-[588px]:w-full max-[588px]:flex max-[588px]:justify-center">
            <!-- Inlined SVG for button appearance -->
            <svg class="h-[96px] w-auto transition-all group-hover:brightness-110"
              style="filter: drop-shadow(0 10px 8px rgb(0 0 0 / 0.3));" xmlns="http://www.w3.org/2000/svg"
              xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 192 66.4">
              <defs>
                <linearGradient id="linear-gradient" x1="96.05" y1="26.6" x2="96.05" y2="65.8"
                  gradientTransform="translate(0 68) scale(1 -1)" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#0045c8" />
                  <stop offset=".7" stop-color="#00c2ff" />
                </linearGradient>
              </defs>
              <g>
                <rect fill="url(#linear-gradient)" x="19.2" y="17.7" width="153.7" height="31.1" rx="15.5" ry="15.5" />
                <image width="896" height="381" transform="translate(-11.2 -16.2) scale(.2)"
                  xlink:href="/src/assets/BT_Compress-1.png" />
              </g>
            </svg>

            <!-- Default Content: Text & Icon -->
            <div id="compressContent"
              class="absolute inset-0 flex items-center justify-center gap-2 text-white font-black text-base uppercase tracking-widest shadow-black drop-shadow-md">
              <span data-i18n="compress">COMPRESS</span>
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z">
                </path>
              </svg>
            </div>

            <!-- Overlay for Loading/Squeezing State -->
            <div id="compressOverlay"
              class="absolute inset-0 flex items-center justify-center gap-2 text-white font-black text-base uppercase tracking-widest opacity-0 transition-opacity pointer-events-none">
              <!-- Content injected by JS -->
            </div>
          </button>

          <!-- IR PARA: revela no Finder/Explorador o ficheiro comprimido -->
          <button id="revealBtn" type="button" title="Open the compressed file folder" data-i18n-title="go_to_title"
            class="h-[44px] shrink-0 px-4 rounded-full bg-white text-black text-[12px] font-black uppercase tracking-wide flex items-center gap-2 cursor-pointer transition-all hover:brightness-105 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed max-[588px]:order-3 max-[588px]:mt-[-14px]"
            style="filter: drop-shadow(0 6px 8px rgb(0 0 0 / 0.22));" disabled>
            <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path stroke-linecap="round" d="M15.4 15.4L21 21" />
            </svg>
            <span data-i18n="go_to">Go to</span>
          </button>
        </div>

        <!-- Progress / status pill — largura do botão de comprimir, fundo #e1e6e6.
             O progresso preenche a própria pílula (barra azul subtil por trás do texto). -->
        <div class="w-full flex justify-center pt-[4px] pb-[10px]">
          <div class="relative overflow-hidden rounded-full bg-[#e1e6e6] h-[40px] min-w-[278px] px-6 flex items-center justify-center">
            <div id="progressBar" class="absolute inset-y-0 left-0 w-0 bg-fart-blue/25 transition-all duration-300"></div>
            <p id="statusMessage" class="relative text-[11px] text-gray-500 font-bold uppercase tracking-tighter whitespace-nowrap" data-i18n="status_idle">
              0% compression...
            </p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal: "Ver as skins anteriores?" (aberto ao clicar na imagem do topo) -->
  <div id="skinsModal"
    class="hidden absolute inset-0 z-[60] flex items-center justify-center bg-black/45 backdrop-blur-sm opacity-0 transition-opacity duration-200">
    <div class="bg-white rounded-[24px] shadow-2xl px-7 py-6 mx-6 max-w-[320px] text-center">
      <p class="text-[17px] font-black text-black leading-snug" data-i18n="skins_question">View previous skins?</p>
      <div class="flex gap-3 justify-center mt-5">
        <button id="skinsCancelBtn" type="button"
          class="px-4 h-[40px] rounded-full bg-gray-100 hover:bg-gray-200 text-black text-[13px] font-black uppercase tracking-wide transition cursor-pointer active:scale-95"
          data-i18n="skins_cancel">Cancel</button>
        <button id="skinsViewBtn" type="button"
          class="px-5 h-[40px] rounded-full bg-fart-blue hover:brightness-110 text-white text-[13px] font-black uppercase tracking-wide transition cursor-pointer active:scale-95"
          data-i18n="skins_view">View</button>
      </div>
    </div>
  </div>

  <!-- Hidden Input -->
  <input type="file" id="fileInput" multiple accept="image/*,application/pdf,.psd,image/vnd.adobe.photoshop" class="hidden">

  <script type="module" src="/src/main.js"></script>
</body>

</html>
