name: Build Windows App
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Download FFmpeg for Windows
        run: |
          mkdir -p src-tauri/binaries
          curl -L -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -j "ffmpeg.zip" "ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe" -d src-tauri/binaries
          mv src-tauri/binaries/ffmpeg.exe src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
        shell: bash
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          
      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Tauri App
        run: npx tauri build

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: FartCompressor-Windows-Build
          path: src-tauri/target/release/bundle/
